<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2ea;
    --rule: #c3cfbc;
    --rule-strong: #8fa287;
    --ink: #1e3557;
    --text: #20261f;
    --muted: #5b6658;
    --signal-red: #a8322a;
    --field: #f8faf6;
    font-family: "Libre Franklin", "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
    color: var(--text);
    background: var(--paper);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    line-height: 1.5;
  }

  main { max-width: 64rem; margin: 0 auto; }

  header {
    border-bottom: 3px double var(--rule-strong);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1.05;
  }

  .totals {
    margin: 0.5rem 0 0;
    font-size: 1.125rem;
    color: var(--muted);
  }

  .totals strong { color: var(--text); font-weight: 700; }

  .register {
    overflow-x: auto;
    border: 1px solid var(--rule-strong);
    background: var(--paper);
  }

  table {
    width: 100%;
    min-width: 46rem;
    border-collapse: collapse;
    font-size: 0.975rem;
  }

  th, td {
    padding: 0.55rem 0.75rem;
    text-align: left;
    vertical-align: middle;
    border-right: 1px solid var(--rule);
  }

  th:last-child, td:last-child { border-right: none; }

  thead th {
    font-weight: 700;
    color: var(--ink);
    border-bottom: 2px solid var(--rule-strong);
    background: #e3e9dd;
  }

  tbody tr + tr td { border-top: 1px solid var(--rule); }

  .col-time { width: 7rem; font-variant-numeric: tabular-nums; }
  .col-when { width: 13rem; font-variant-numeric: tabular-nums; }
  .col-action { width: 6.5rem; text-align: right; }

  /* The blank next line of the register is where you write a new entry */
  .entry-line td {
    background: #e7eee2;
    border-bottom: 2px solid var(--rule-strong);
  }

  input[type="datetime-local"], input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--rule-strong);
    border-radius: 2px;
    padding: 0.35rem 0.45rem;
  }

  .preview { color: var(--muted); font-variant-numeric: tabular-nums; }
  .preview.invalid { color: var(--signal-red); }

  button {
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    border-radius: 2px;
    padding: 0.4rem 0.8rem;
  }

  .log-button {
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink);
  }

  .log-button:hover { background: #2b4a77; }

  .delete-button {
    background: none;
    color: var(--signal-red);
    border: 1px solid transparent;
    font-weight: 500;
  }

  .delete-button:hover { border-color: var(--signal-red); }

  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .entry-row td { color: var(--ink); }
  .entry-row .worked-on { color: var(--text); }

  .empty td {
    padding: 2rem 0.75rem;
    color: var(--muted);
  }

  .status {
    min-height: 1.5rem;
    margin: 0.75rem 0 0;
    font-weight: 500;
  }

  .status.error { color: var(--signal-red); }

  footer {
    margin-top: 2rem;
    font-size: 0.875rem;
    color: var(--muted);
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Coding register</h1>
    <p class="totals" id="totals">Loading sessions…</p>
  </header>

  <form id="new-session" novalidate></form>

  <div class="register">
    <table>
      <caption class="visually-hidden">Logged coding sessions, newest first</caption>
      <thead>
        <tr>
          <th scope="col" class="col-when">Started</th>
          <th scope="col" class="col-when">Finished</th>
          <th scope="col" class="col-time">Time</th>
          <th scope="col">Worked on</th>
          <th scope="col" class="col-action"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody id="entries">
        <tr class="entry-line">
          <td><label class="visually-hidden" for="start">Started</label>
            <input form="new-session" type="datetime-local" id="start" required></td>
          <td><label class="visually-hidden" for="end">Finished</label>
            <input form="new-session" type="datetime-local" id="end" required></td>
          <td><span class="preview" id="preview">–</span></td>
          <td><label class="visually-hidden" for="description">Worked on</label>
            <input form="new-session" type="text" id="description" placeholder="What did you work on?" maxlength="200"></td>
          <td class="col-action"><button form="new-session" type="submit" class="log-button">Log session</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <footer>Data comes from your CodingTracker repository through the same interface the console app uses.</footer>
</main>

<script src="app.js"></script>
</body>
</html>
